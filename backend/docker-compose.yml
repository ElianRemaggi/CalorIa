services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: caloria
      POSTGRES_USER: caloria
      POSTGRES_PASSWORD: caloria
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caloria"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/caloria
      DATABASE_USERNAME: caloria
      DATABASE_PASSWORD: caloria
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id.apps.googleusercontent.com}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Test runner — uses the builder stage (has Maven + cached deps + source).
  # Testcontainers spins up its own Postgres; no running DB needed.
  # Usage: docker compose run --rm test
  test:
    build:
      context: .
      target: builder
    entrypoint: ["mvn"]
    command: ["test"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GOOGLE_CLIENT_ID: your-google-client-id.apps.googleusercontent.com

volumes:
  postgres-data:
